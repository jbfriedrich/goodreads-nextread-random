name: nextbook

services:
  nextbook:
    build: .
    # Or, if you build & push the image separately, use it instead of `build`:
    # image: your-registry/nextbook:latest
    container_name: nextbook
    restart: unless-stopped

    # nginx inside the container listens on 80. SSL is terminated upstream by
    # your existing setup, so publish it on a host port and point your proxy at it.
    ports:
      - "8080:80"

    volumes:
      # Persist the SQLite copy of the shelf across container rebuilds. A named
      # volume (not a ./data bind mount) so it also works when the Docker
      # context points at a remote host, where local paths do not exist.
      - nb_data:/app/data
      # Optional: swap the shelf without rebuilding the image.
      # - ./config.yaml:/app/config.yaml:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # On first start with an empty data volume the server listens once the
      # first 100 books are stored, a few seconds in.
      start_period: 30s

volumes:
  nb_data:
