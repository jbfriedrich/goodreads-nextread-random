# The Goodreads shelf URL, copied from your browser.
# Replace YOUR_USER_ID with your Goodreads user id (the number in the URL) and
# keep the ?shelf=... parameter. No login is needed, but the profile and shelf
# must be public: the shelf is read through Goodreads' public shelf widget and
# its size is checked against the count on the public profile page.
list_url: "https://www.goodreads.com/review/list/YOUR_USER_ID?shelf=to-read"

# How many times a day the shelf is synced with Goodreads (1-1440). Most syncs
# are a 2-request check, which also picks up newly added books; a full harvest
# (~40 requests for ~600 books) runs only when books were removed, plus weekly.
# Optional; defaults to 4. The --scrapes-per-day flag of `serve` overrides it.
scrapes_per_day: 4

# Where the SQLite copy of the shelf is kept. A relative path is resolved
# against this file's directory. Optional; defaults to data/nextread.db.
db_path: "data/nextread.db"

# Optional tuning (Go durations / counts), shown with their defaults:
# request_delay: "1.5s"       # gap between requests while syncing
# enrich_delay: "2s"          # gap between enrichment requests (25 books per request)
# max_requests: 80            # cap on requests per full harvest
# http_timeout: "30s"         # timeout of each HTTP request
# full_harvest_every: "168h"  # safety-net full harvest even without changes
# sync_retry_after: "1h"      # longest wait before retrying a failed sync
# enrich_error_pause: "5m"    # enrichment pause after an error whose retries ran out
# graphql_endpoint: ""        # override only if Goodreads moves its GraphQL API
#
# Every setting above except db_path and graphql_endpoint, plus list_url, can
# also be set with an environment variable that overrides this file:
# NEXTREAD_ + the key in upper case, e.g. NEXTREAD_REQUEST_DELAY=2s or
# NEXTREAD_LIST_URL=... (handy because this file is baked into the image).
